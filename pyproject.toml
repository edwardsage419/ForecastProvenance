[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-trust-core"
version = "0.1.0"
description = "Synthetic implementation of Forecast Provenance Project Trust Core v0.4"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.0.2", "jsonschema==4.26.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
